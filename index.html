<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Cambodia 3D Map</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="src/style.css" />
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
</head>
<body>
  <div id="map"></div>

  <aside id="panel" class="panel">
    <button id="panel-toggle" class="panel-handle" aria-label="Toggle panel"><span></span></button>
    <header>
      <h1>Cambodia 3D</h1>
      <p class="sub">Terrain + 3D buildings · v0.1</p>
    </header>

    <section>
      <h2>Go to</h2>
      <div id="places" class="chips"></div>
    </section>

    <section>
      <h2>Style</h2>
      <div class="seg" role="group">
        <button data-theme="day" class="active">Day</button>
        <button data-theme="night">Night</button>
      </div>
    </section>

    <section>
      <h2>Layers</h2>
      <label class="row"><input type="checkbox" id="tg-buildings" checked /> 3D buildings</label>
      <label class="row"><input type="checkbox" id="tg-terrain" checked /> Terrain</label>
      <label class="row col">
        <span>Terrain height <b id="exag-val">1.5×</b></span>
        <input type="range" id="exag" min="1" max="10" step="0.5" value="1.5" />
      </label>
    </section>
  </aside>

  <div id="info" class="info hidden"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
